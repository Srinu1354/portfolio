
---
layout: default
---
<article class="case-study">
    <header class="case-study-header">
        <h1>{{ page.title }}</h1>
        <div class="case-study-meta">
            <span class="category">{{ page.category }}</span>
            <span class="date">{{ page.date | date: "%B %d, %Y" }}</span>
        </div>
    </header>
    <div class="case-study-content">
        {{ content }}
    </div>
</article>
